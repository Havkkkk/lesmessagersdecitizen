<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brave Patron ! </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url('./image.webp') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            width: 70%;
            margin: 20px auto;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .autocomplete-suggestions {
            position: absolute;
            border: 1px solid #ccc;
            border-top: none;
            max-height: 150px;
            overflow-y: auto;
            background-color: #fff;
            z-index: 1000;
            width: 70%;
            box-sizing: border-box;
        }
        .autocomplete-suggestion {
            padding: 10px;
            cursor: pointer;
        }
        .autocomplete-suggestion:hover {
            background-color: #eee;
        }
        .product-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product-item {
            background-color: #F9F9F9;
            padding: 15px;
            padding-top: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: calc(33% - 20px);
            box-sizing: border-box;
            position: relative;
        }
        .product-item p {
            margin: 5px 0;
        }
        .product-item .location {
            font-style: italic;
        }
        .product-item .system {
            font-weight: bold;
            color: #007bff;
        }
        .product-item .remove-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #F44336;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 5px;
            cursor: pointer;
        }
        .footer {
            background: rgba(255, 255, 255, 0.9);
            border-top: 1px solid #ddd;
            padding: 10px 20px;
            box-shadow: 0 -1px 5px rgba(0,0,0,0.1);
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            position: fixed;
            bottom: 0;
            width: 100%;
            left: 0;
            z-index: 1000;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid #ddd;
        }
        .header a {
            text-decoration: none;
            color: #007bff;
            font-size: 1.2em;
            font-weight: bold;
        }
        .header a:hover {
            text-decoration: underline;
        }
        .location-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .system-badge {
            background: #007bff;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html">Retour à l'accueil</a>
    </div>
    <div class="container">
        <h1>Yela yelaaaa</h1>
        <div class="form-group">
            <label for="productName">Nom du produit :</label>
            <input type="text" id="productName" placeholder="Entrez le nom du produit" oninput="fetchProductSuggestions()" autocomplete="off">
            <div id="suggestions" class="autocomplete-suggestions"></div>
        </div>
        <div class="form-group">
            <label for="scu">Quantité (SCU) :</label>
            <input type="text" id="scu" placeholder="Entrez la quantité" oninput="updateTotal()">
        </div>
        <div class="form-group">
            <label for="price">Prix unitaire :</label>
            <input type="text" id="price" disabled>
        </div>
        <div class="form-group">
            <label for="sellLocations">Où vendre :</label>
            <select id="sellLocations" onchange="updatePrice()">
                <option value="">Sélectionnez un produit d'abord</option>
            </select>
        </div>
        <div class="result" id="total">Total : 0 UEC</div>
        <button id="addProductButton" onclick="addProduct()">Ajouter un produit</button>
        <div id="productList" class="product-list"></div>
    </div>
    <div class="footer">
        <span id="finalTotal">Total final : 0 UEC</span>
    </div>
    <script>
        let productData = [];
        let terminalsData = [];
        let productList = [];
        let isLoading = false;

        // Fonction pour obtenir le système depuis le nom du terminal
        function getSystemFromTerminal(terminalName) {
            const terminal = terminalsData.find(t => t.name === terminalName);
            return terminal ? terminal.system : 'Inconnu';
        }

        async function fetchProductData() {
            if (isLoading) return;
            isLoading = true;
            
            try {
                // Récupération des données des commodités
                const commoditiesResponse = await fetch('https://uexcorp.space/api/2.0/commodities_prices_all');
                const commoditiesResult = await commoditiesResponse.json();
                productData = commoditiesResult.data || [];

                // Utilisation du mapping par défaut pour les terminaux
                terminalsData = createDefaultTerminalsMapping();
                console.log("Données des produits chargées :", productData.length, "produits");

            } catch (error) {
                console.error("Erreur lors de la récupération des données : ", error);
            } finally {
                isLoading = false;
            }
        }

        // Mapping par défaut des terminaux vers les systèmes
        function createDefaultTerminalsMapping() {
            return [
                // Stanton - Crusader
                { name: 'Port Olisar', system: 'Stanton' },
                { name: 'CRU-L1', system: 'Stanton' },
                { name: 'CRU-L4', system: 'Stanton' },
                { name: 'CRU-L5', system: 'Stanton' },
                
                // Stanton - Hurston
                { name: 'Lorville', system: 'Stanton' },
                { name: 'Everus Harbor', system: 'Stanton' },
                { name: 'HUR-L1', system: 'Stanton' },
                { name: 'HUR-L2', system: 'Stanton' },
                { name: 'HUR-L3', system: 'Stanton' },
                { name: 'HUR-L4', system: 'Stanton' },
                { name: 'HUR-L5', system: 'Stanton' },
                
                // Stanton - ArcCorp
                { name: 'Area18', system: 'Stanton' },
                { name: 'Baijini Point', system: 'Stanton' },
                { name: 'ARC-L1', system: 'Stanton' },
                
                // Stanton - microTech
                { name: 'New Babbage', system: 'Stanton' },
                { name: 'Tressler Foundation', system: 'Stanton' },
                { name: 'MIC-L1', system: 'Stanton' },
                
                // Stanton - Autres
                { name: 'Grim HEX', system: 'Stanton' },
                
                // Pyro
                { name: 'Pyro Station Alpha', system: 'Pyro' },
                { name: 'Ruin Station', system: 'Pyro' },
                { name: 'Checkmate Station', system: 'Pyro' },
                { name: 'Shady Glen', system: 'Pyro' },
                { name: 'Bloom', system: 'Pyro' },
                { name: 'Terminus', system: 'Pyro' },
                
                // Nyx
                { name: 'Levski', system: 'Nyx' },
                
                // Terra
                { name: 'Terra Prime', system: 'Terra' },
                
                // Autres systèmes possibles
                { name: 'Spider', system: 'Cathcart' },
                { name: 'Jumptown', system: 'Stanton' }
            ];
        }

        // Fonction pour extraire le système depuis le nom du terminal (méthode alternative)
        function extractSystemFromTerminalName(terminalName) {
            // Essayer d'abord avec les données des terminaux
            const system = getSystemFromTerminal(terminalName);
            if (system !== 'Inconnu') {
                return system;
            }

            // Si pas trouvé, essayer de déduire depuis le nom
            const lowerName = terminalName.toLowerCase();
            
            // Stations Stanton
            if (lowerName.includes('olisar') || lowerName.includes('area18') || 
                lowerName.includes('lorville') || lowerName.includes('babbage') ||
                lowerName.includes('grim') || lowerName.includes('everus') ||
                lowerName.includes('cru-') || lowerName.includes('hur-') ||
                lowerName.includes('arc-') || lowerName.includes('mic-') ||
                lowerName.includes('baijini') || lowerName.includes('tressler')) {
                return 'Stanton';
            }
            
            // Stations Pyro
            if (lowerName.includes('pyro') || lowerName.includes('ruin') ||
                lowerName.includes('checkmate') || lowerName.includes('shady') ||
                lowerName.includes('bloom') || lowerName.includes('terminus')) {
                return 'Pyro';
            }
            
            return 'Inconnu';
        }

        function fetchProductSuggestions() {
            const input = document.getElementById("productName").value.toLowerCase();
            const suggestionsContainer = document.getElementById("suggestions");
            suggestionsContainer.innerHTML = "";
            
            if (input.length > 1) {
                const filteredProducts = productData.filter(product =>
                    product.commodity_name.toLowerCase().includes(input)
                );
                const uniqueProducts = [...new Set(filteredProducts.map(p => p.commodity_name))];
                
                uniqueProducts.forEach(name => {
                    const suggestion = document.createElement("div");
                    suggestion.classList.add("autocomplete-suggestion");
                    suggestion.innerText = name;
                    suggestion.onclick = () => {
                        const selectedProduct = filteredProducts.find(p => p.commodity_name === name);
                        selectProduct(selectedProduct);
                        suggestionsContainer.innerHTML = "";
                        document.getElementById("productName").focus();
                    };
                    suggestionsContainer.appendChild(suggestion);
                });
            }
        }

        function selectProduct(product) {
            document.getElementById("productName").value = product.commodity_name;
            populateSellLocations(product);
        }

        function populateSellLocations(product) {
            const sellLocations = document.getElementById("sellLocations");
            sellLocations.innerHTML = "";
            
            const productLocations = productData
                .filter(p => p.commodity_name === product.commodity_name)
                .map(p => ({
                    name: p.terminal_name,
                    price: p.price_sell,
                    system: extractSystemFromTerminalName(p.terminal_name)
                }));

            // Trier les locations par prix du plus élevé au plus bas
            productLocations.sort((a, b) => b.price - a.price);

            // Ajouter les locations au select
            productLocations.forEach(loc => {
                const option = document.createElement("option");
                option.value = loc.name;
                option.textContent = `${loc.name} (${loc.system}) - ${loc.price.toFixed(2)} UEC`;
                option.dataset.system = loc.system;
                sellLocations.appendChild(option);
            });

            if (productLocations.length > 0) {
                sellLocations.value = productLocations[0].name;
                updatePrice();
            }
        }

        function updatePrice() {
            const productName = document.getElementById("productName").value;
            const sellLocation = document.getElementById("sellLocations").value;
            const locationData = productData.find(p => p.terminal_name === sellLocation && p.commodity_name === productName);
            
            if (locationData) {
                const price = locationData.price_sell;
                document.getElementById("price").value = price.toFixed(2) + " UEC";
                updateTotal();
            }
        }

        function updateTotal() {
            const scu = parseFloat(document.getElementById("scu").value.replace(/ /g, '')) || 0;
            const price = parseFloat(document.getElementById("price").value.replace(' UEC', '').replace(/ /g, '')) || 0;
            const total = scu * price;
            document.getElementById("total").innerText = "Total : " + total.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " UEC";
        }

        function addProduct() {
            const productName = document.getElementById("productName").value;
            const scu = parseFloat(document.getElementById("scu").value.replace(/ /g, '')) || 0;
            const price = parseFloat(document.getElementById("price").value.replace(' UEC', '').replace(/ /g, '')) || 0;
            const sellLocation = document.getElementById("sellLocations").value;
            const system = extractSystemFromTerminalName(sellLocation);
            const total = scu * price;

            if (productName && scu && price && sellLocation) {
                const productListElement = document.getElementById("productList");
                const productId = Date.now();
                const productItem = document.createElement("div");
                productItem.classList.add("product-item");
                productItem.dataset.productId = productId;
                productItem.innerHTML = `
                    <p><strong>Produit :</strong> ${productName}</p>
                    <p><strong>Quantité (SCU) :</strong> ${scu.toLocaleString('fr-FR')}</p>
                    <p><strong>Prix unitaire :</strong> ${price.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} UEC</p>
                    <p class="system"><strong>Système :</strong> ${system}</p>
                    <p class="location"><strong>Où vendre :</strong> ${sellLocation}</p>
                    <p><strong>Total :</strong> ${total.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} UEC</p>
                    <button class="remove-button" onclick="removeProduct(${productId})">Supprimer</button>
                `;
                productListElement.appendChild(productItem);
                
                productList.push({ id: productId, productName, scu, price, total, sellLocation, system });
                updateFinalTotal();
                
                // Réinitialiser les champs
                document.getElementById("productName").value = "";
                document.getElementById("scu").value = "";
                document.getElementById("price").value = "";
                document.getElementById("sellLocations").innerHTML = '<option value="">Sélectionnez un produit d\'abord</option>';
                document.getElementById("total").innerText = "Total : 0 UEC";
            } else {
                alert("Veuillez remplir tous les champs.");
            }
        }

        function removeProduct(productId) {
            productList = productList.filter(product => product.id !== productId);
            const productItem = document.querySelector(`.product-item[data-product-id="${productId}"]`);
            if (productItem) {
                productItem.remove();
            }
            updateFinalTotal();
        }

        function updateFinalTotal() {
            const finalTotal = productList.reduce((sum, product) => sum + product.total, 0);
            document.getElementById("finalTotal").innerText = "Total final : " + finalTotal.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " UEC";
        }

        window.onload = fetchProductData;
    </script>
</body>
</html>
